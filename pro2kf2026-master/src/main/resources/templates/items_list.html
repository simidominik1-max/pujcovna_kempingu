<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Item List</title>
</head>
<body>

<h1>Item List</h1>

<a th:href="@{/items/create}">Create a New Item</a>
<br><br>

<form th:action="@{/items/}" method="get">
    Category:
    <select name="categoryId">
        <option value="">-- all --</option>
        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.name}"
                th:selected="${category.id == selectedCategoryId}"></option>
    </select>
    <input type="submit" value="Filter">
</form>
<br>

<ul>
    <li th:each="item: ${items}">
        <a th:href="@{'/items/' + ${item.id}}" th:text="${item.name}"></a>
        &ndash; <span th:text="${item.category != null ? item.category.name : '-'}"></span>,
        <span th:text="${item.pricePerDay}"></span> Kc/den
    </li>
</ul>

<br>
<a th:href="@{/}">Back to Home</a>

</body>
</html>
